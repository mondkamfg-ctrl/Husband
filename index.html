<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بہترین شوہر کی 100 نشانیاں</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Nastaliq Urdu',serif;background:#fdfbf5;color:#222;line-height:2}
header{background:linear-gradient(135deg,#0d4a30,#1e8c54);color:#fff;padding:40px 15px;text-align:center}
header h1{font-size:38px} header p{font-size:18px;margin-top:10px}
.top-link a{background:#fff;color:#0d4a30;padding:9px 20px;border-radius:25px;text-decoration:none;font-weight:700;margin:5px;display:inline-block}
.menu{position:sticky;top:0;background:#fff;padding:12px;box-shadow:0 2px 10px #0001;display:flex;gap:8px;overflow-x:auto;z-index:9}
.menu button{border:2px solid #1e8c54;background:#fff;color:#1e8c54;padding:7px 16px;border-radius:20px;font-family:inherit;font-weight:700;cursor:pointer}
.menu button.active{background:#1e8c54;color:#fff}
.wrap{max-width:1100px;margin:20px auto;padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0001;border-right:5px solid #1e8c54}
.card b.num{background:#e8f5e9;color:#0d4a30;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;margin-left:6px}
.card h3{font-size:19px;color:#0d4a30} .card p
